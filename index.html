<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CA Final Study Tracker — Nov 2027</title><link rel="stylesheet" href="styles.css">
<script>
(function(){try{if(localStorage.getItem("ca-final-theme")==="dark")document.documentElement.classList.add("dark-pending");}catch(e){}})();
</script>
<style>html.dark-pending,html.dark-pending body{background:#0f1419;color:#e8eef7}</style>
</head>
<body>
<div id="app">
<aside class="sidebar"><div class="brand"><div class="brand-mark">CA</div><div><b>Final 2027</b><small>Study Tracker</small></div></div>
<nav>
<button class="nav active" data-view="dashboard">⌂ Dashboard</button>
<button class="nav" data-view="study">✓ Study</button>
<button class="nav" data-view="subjects">▦ Subjects</button>
<button class="nav" data-view="revisions">↻ Revisions</button>
<button class="nav" data-view="hours">⏱ Hours</button>
<button class="nav" data-view="week">📊 Week</button>
<button class="nav" data-view="timer">⏲ Timer</button>
<button class="nav" data-view="resources">🔗 Resources</button>
<button class="nav" data-view="planner">▣ Planner</button>
<button class="nav" data-view="settings">⚙ Settings</button>
</nav>
<div class="side-bottom"><b>NOV 2027</b><button id="backup">Export Backup</button></div></aside>
<main>
<header>
  <div><small>CA FINAL</small><h1 id="title">Dashboard</h1></div>
  <div class="header-actions">
    <button type="button" id="themeToggle" title="Toggle dark mode">◐</button>
    <button id="quick">+ Add Study</button>
  </div>
</header>
<section id="content"></section>
</main>
</div>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script src="app-tz.js"></script>
<script src="app-timer.js"></script>
<script src="app-hours.js"></script>
<script src="app-hours-ist.js"></script>
<script src="app-extras.js"></script>
<script src="app-week.js"></script>
<script src="app-features.js"></script>
<script src="app-theme.js"></script>
</body></html>
